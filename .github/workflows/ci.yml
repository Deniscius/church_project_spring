name: CI

on:
  push:
    branches: [main, master, develop, 'refactor/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: church_project_ci
          POSTGRES_USER: church_ci
          POSTGRES_PASSWORD: church_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U church_ci -d church_project_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate Flyway migrations on PostgreSQL
        run: >-
          ./mvnw -B
          -Dflyway.url=jdbc:postgresql://localhost:5432/church_project_ci
          -Dflyway.user=church_ci
          -Dflyway.password=church_ci_password
          flyway:migrate flyway:validate
      - name: Unit tests
        run: ./mvnw -B -DskipITs test

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/church-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/church-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          VITE_API_BASE_URL: https://api.example.com
          VITE_PUBLIC_SITE_URL: https://www.example.com
        run: npm run build
