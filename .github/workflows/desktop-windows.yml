name: Desktop Windows
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths:
      - 'Desktop/**'
      - 'Backend/src/main/java/com/missanye/printing/**'
      - 'Backend/src/main/resources/com/missanye/printing/**'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'Desktop/**'
      - 'Backend/src/main/java/com/missanye/printing/**'
      - 'Backend/src/main/resources/com/missanye/printing/**'
      - '.github/workflows/desktop-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    outputs:
      app-version: ${{ steps.version.outputs.version }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Validate PowerShell scripts
        run: |
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Output $_.ToString() }
              throw "PowerShell syntax errors in $($script.Name)"
            }
          }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Desktop/pom.xml
      - name: Resolve application version
        id: version
        run: |
          $appVersion = '0.2.2'
          if ($env:GITHUB_REF -like 'refs/tags/desktop-v*') {
            $appVersion = $env:GITHUB_REF_NAME -replace '^desktop-v', ''
            if ($appVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid desktop release tag' }
          }
          "version=$appVersion" >> $env:GITHUB_OUTPUT
      - name: Test and build bundled Windows application
        run: ./scripts/package.ps1 -AppVersion '${{ steps.version.outputs.version }}'
      - name: Build Inno Setup installer
        run: ./scripts/installer.ps1 -AppVersion '${{ steps.version.outputs.version }}'
      - name: Verify silent installation and uninstallation
        run: |
          $installer = (Resolve-Path target/installer/Missanye-Setup.exe).Path
          $installDir = Join-Path $env:RUNNER_TEMP 'Missanye-install-test'
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$installDir`""
          $setup = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installation failed: $($setup.ExitCode)" }
          foreach ($file in @('Missanye.exe', 'runtime/bin/server/jvm.dll', 'app/missanye-desktop-0.1.0-SNAPSHOT.jar', 'unins000.exe')) {
            if (-not (Test-Path (Join-Path $installDir $file))) { throw "Installed file missing: $file" }
          }
          # An upgrade must keep per-installation parish configuration.
          $binding = Join-Path $installDir 'app/parish.properties'
          'upgrade-fixture=preserved' | Set-Content $binding
          $upgrade = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Upgrade failed: $($upgrade.ExitCode)" }
          if ((Get-Content $binding -Raw).Trim() -ne 'upgrade-fixture=preserved') { throw 'Upgrade replaced parish configuration.' }
          $uninstall = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstallation failed: $($uninstall.ExitCode)" }
          if (Test-Path (Join-Path $installDir 'Missanye.exe')) { throw 'Application was not uninstalled.' }
      - name: Archive portable Windows application
        run: |
          Compress-Archive -Path target/distribution/Missanye -DestinationPath target/Missanye-Windows.zip
          (Get-FileHash target/Missanye-Windows.zip -Algorithm SHA256).Hash | Set-Content target/Missanye-Windows.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Missanye-Windows
          path: |
            Desktop/target/Missanye-Windows.zip
            Desktop/target/Missanye-Windows.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Missanye-Setup-Windows
          path: |
            Desktop/target/installer/Missanye-Setup.exe
            Desktop/target/installer/Missanye-Setup.exe.sha256
          if-no-files-found: error

      - name: Publish desktop interface previews
        uses: actions/upload-artifact@v4
        with:
          name: Missanye-Interface-Previews
          path: |
            Desktop/target/desktop-*.png
            Desktop/target/desktop-local-receipt-preview.pdf
            Desktop/target/desktop-intention-preview.pdf
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Missanye-Setup-Windows
          path: release
      - name: Publish tested Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: desktop-v${{ needs.windows.outputs.app-version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Version already published: $RELEASE_TAG (installer preserved)"
            exit 0
          fi
          tag_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null) || tag_commit=""
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$RELEASE_SHA" ]; then
            echo "Existing tag does not match the tested commit: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/Missanye-Setup.exe release/Missanye-Setup.exe.sha256 --target "$RELEASE_SHA" --latest --title "Missanye Desktop $RELEASE_TAG" --generate-notes
