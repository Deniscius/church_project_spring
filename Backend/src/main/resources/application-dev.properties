# ===============================
# DEVELOPMENT PROFILE
# Activate with: SPRING_PROFILES_ACTIVE=dev
# ===============================

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/church_project_db}
# Valeurs locales uniquement. Une variable d'environnement peut toujours les
# surcharger sans rendre le premier démarrage inutilement complexe.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# Hibernate: convenient during development only
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Secret réservé au développement local. Les profils staging et prod exigent
# toujours explicitement JWT_SECRET.
jwt.secret=${JWT_SECRET:c2VjcmV0S2V5c0hvdWxkQmVBdExlYXN0MjU2Qml0c0xvbmc=}

# Initial administrator: development only
app.admin-seed.enabled=${APP_ADMIN_SEED_ENABLED:true}
app.admin-seed.username=${APP_ADMIN_SEED_USERNAME:admin}
app.admin-seed.password=${APP_ADMIN_SEED_PASSWORD:ChangeMe123!}
app.admin-seed.nom=${APP_ADMIN_SEED_NOM:Administrateur}
app.admin-seed.prenom=${APP_ADMIN_SEED_PRENOM:Système}
app.admin-seed.role=${APP_ADMIN_SEED_ROLE:SUPER_ADMIN}

# API documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logs
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
