# ===============================
# DEVELOPMENT PROFILE
# Activate with: SPRING_PROFILES_ACTIVE=dev
# ===============================

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/church_project_db}
# Valeurs locales uniquement. Une variable d'environnement peut toujours les
# surcharger sans rendre le premier démarrage inutilement complexe.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# En développement, une migration déjà appliquée peut être retouchée localement :
# repair avant migrate évite le blocage « checksum mismatch ».
spring.flyway.repair-on-migrate=true

# Le schéma appartient à Flyway, y compris en développement : Hibernate se
# contente de vérifier que les entités correspondent aux tables migrées. Une
# divergence doit se corriger par une nouvelle migration, pas par un ALTER
# implicite qui ne serait jamais rejoué en production.
spring.jpa.hibernate.ddl-auto=validate
# show-sql=true + DEBUG SQL tue le p90 sous charge ; activer via SPRING_JPA_SHOW_SQL=true si besoin
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Domaines ngrok (partage local) — patterns Spring, pas besoin de figer l'URL
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.ngrok-free.dev,https://*.ngrok-free.app,https://*.ngrok.io}

# Secret réservé au développement local. Les profils staging et prod exigent
# toujours explicitement JWT_SECRET.
jwt.secret=${JWT_SECRET:c2VjcmV0S2V5c0hvdWxkQmVBdExlYXN0MjU2Qml0c0xvbmc=}

# Initial administrator: development only
app.admin-seed.enabled=${APP_ADMIN_SEED_ENABLED:true}
app.admin-seed.username=${APP_ADMIN_SEED_USERNAME:admin}
app.admin-seed.password=${APP_ADMIN_SEED_PASSWORD:ChangeMe123!}
app.admin-seed.nom=${APP_ADMIN_SEED_NOM:Administrateur}
app.admin-seed.prenom=${APP_ADMIN_SEED_PRENOM:Système}
app.admin-seed.role=${APP_ADMIN_SEED_ROLE:SUPER_ADMIN}

# API documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logs (SQL DEBUG uniquement si SPRING_JPA_SHOW_SQL=true)
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LEVEL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LEVEL:OFF}

# FedaPay sandbox (mettre FEDAPAY_ENABLED=true + clés pour tester)
fedapay.enabled=${FEDAPAY_ENABLED:true}
fedapay.environment=sandbox

# application-dev.properties
spring.docker.compose.enabled=false
