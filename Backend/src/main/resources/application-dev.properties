# ===============================
# DEVELOPMENT PROFILE
# Activate with: SPRING_PROFILES_ACTIVE=dev
# Secrets : définir via variables d'environnement ou Backend/.env (non versionné).
# Voir Backend/.env.example
# ===============================

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/church_project_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JWT — obligatoire (aucun défaut en dépôt)
jwt.secret=${JWT_SECRET:}

# Seed admin local — mot de passe uniquement via env
app.admin-seed.enabled=${APP_ADMIN_SEED_ENABLED:true}
app.admin-seed.username=${APP_ADMIN_SEED_USERNAME:admin}
app.admin-seed.password=${APP_ADMIN_SEED_PASSWORD:}
app.admin-seed.nom=${APP_ADMIN_SEED_NOM:Administrateur}
app.admin-seed.prenom=${APP_ADMIN_SEED_PRENOM:Système}
app.admin-seed.role=${APP_ADMIN_SEED_ROLE:SUPER_ADMIN}

# En développement, une migration déjà appliquée peut être retouchée localement :
# repair avant migrate évite le blocage « checksum mismatch ».
spring.flyway.repair-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.ngrok-free.dev,https://*.ngrok-free.app,https://*.ngrok.app,https://*.ngrok.io,https://*.loca.lt,https://*.localtunnel.me}

# API documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logs
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LEVEL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LEVEL:OFF}

# FedaPay sandbox (clés via FEDAPAY_SECRET_KEY / FEDAPAY_WEBHOOK_SECRET)
fedapay.enabled=${FEDAPAY_ENABLED:true}
fedapay.environment=sandbox

spring.docker.compose.enabled=false
