# ===============================
# PRODUCTION PROFILE
# Activate with: SPRING_PROFILES_ACTIVE=prod
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Render / reverse-proxy : X-Forwarded-* pour HTTPS et cookies Secure
server.forward-headers-strategy=framework

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

jwt.secret=${JWT_SECRET}
jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
# Render *.onrender.com = cross-site → JWT_COOKIE_SAME_SITE=None (voir render.yaml).
# Domaines custom même eTLD+1 (api.missanye.com + www.missanye.com) → Lax.
jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:None}
jwt.cookie-encrypt=${JWT_COOKIE_ENCRYPT:true}

app.admin-seed.enabled=false
# SMTP obligatoire en prod (OTP, reset, identifiants) — pas de log du corps
app.mail.fail-closed=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Actuator : santé publique ; prometheus/info derrière auth SUPER_ADMIN
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=never

# Pool JDBC ↔ Tomcat : éviter threads HTTP ≫ connexions DB
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:8}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:10000}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:80}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}

# FedaPay production — clés obligatoires si enabled=true
fedapay.enabled=${FEDAPAY_ENABLED:false}
fedapay.environment=${FEDAPAY_ENVIRONMENT:live}
fedapay.secret-key=${FEDAPAY_SECRET_KEY:}
fedapay.webhook-secret=${FEDAPAY_WEBHOOK_SECRET:}
fedapay.callback-base-url=${FEDAPAY_CALLBACK_BASE_URL}

# Stockage : sur Render, monter un disque persistant et fixer APP_STORAGE_ROOT
# (ex. /var/data/uploads). Sans disque, le FS est éphémère (perdu au redeploy).
app.storage.root=${APP_STORAGE_ROOT:./uploads}

