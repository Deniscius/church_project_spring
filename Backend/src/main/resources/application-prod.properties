# ===============================
# PRODUCTION PROFILE
# Activate with: SPRING_PROFILES_ACTIVE=prod
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

jwt.secret=${JWT_SECRET}

app.admin-seed.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Actuator : santé uniquement en production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Pool JDBC production (plus large que le défaut commun)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:150}

# FedaPay production — clés obligatoires si enabled=true
fedapay.enabled=${FEDAPAY_ENABLED:false}
fedapay.environment=${FEDAPAY_ENVIRONMENT:live}
fedapay.secret-key=${FEDAPAY_SECRET_KEY:}
fedapay.webhook-secret=${FEDAPAY_WEBHOOK_SECRET:}
fedapay.callback-base-url=${FEDAPAY_CALLBACK_BASE_URL}
