# ===============================
# APPLICATION - COMMON SETTINGS
# ===============================
spring.application.name=church_project_spring

# Le profil dev reste le profil par défaut pendant la phase de développement.
# Les environnements staging et prod doivent toujours définir explicitement
# SPRING_PROFILES_ACTIVE.
spring.profiles.default=dev

server.port=${PORT:8081}

# ===============================
# DATABASE - COMMON SETTINGS
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver

# Les bases existantes ont été créées initialement par Hibernate. Flyway les
# référence à la version 0, puis applique les migrations du projet.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ===============================
# JPA / TIMEZONE - COMMON SETTINGS
# ===============================
spring.jackson.time-zone=Africa/Lome
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Lome

# Conservé temporairement pour ne pas casser les réponses qui utilisent encore
# des relations JPA lazy. Il sera désactivé après la généralisation des DTO.
spring.jpa.open-in-view=true

# ===============================
# JWT - COMMON SETTINGS
# ===============================
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# SWAGGER / OPENAPI - COMMON PATHS
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ===============================
# ACTUATOR - COMMON SETTINGS
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ===============================
# SECURITY / HEADERS - COMMON SETTINGS
# ===============================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
