# ===============================
# APPLICATION - COMMON SETTINGS
# ===============================
spring.application.name=church_project_spring

# Le profil dev reste le profil par défaut pendant la phase de développement.
# Les environnements staging et prod doivent toujours définir explicitement
# SPRING_PROFILES_ACTIVE.
spring.profiles.default=dev

server.port=${PORT:8081}

# ===============================
# DATABASE - COMMON SETTINGS
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool JDBC (tous profils) — prod peut surcharger via HIKARI_*
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:3}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_MS:60000}

# Flyway est l'unique propriétaire du schéma : V1 crée l'intégralité des tables,
# y compris sur une base vierge. Hibernate ne fait plus que valider (ddl-auto).
# Aucun baseline n'est configuré volontairement : une base déjà peuplée mais sans
# historique Flyway doit être traitée explicitement plutôt que silencieusement.
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# ===============================
# SERVER / TOMCAT - THROUGHPUT
# ===============================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:100}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE:10}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}
server.tomcat.connection-timeout=${TOMCAT_CONNECTION_TIMEOUT:20000}

# ===============================
# JPA / TIMEZONE - COMMON SETTINGS
# ===============================
spring.jackson.time-zone=Africa/Lome
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Lome

# Session Hibernate fermée hors des @Transactional (évite le N+1 « caché » HTTP).
spring.jpa.open-in-view=false

# Batch JDBC : accélère saveAll (dates de célébration, etc.)
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# ===============================
# FEDAPAY (agrégateur paiements)
# ===============================
fedapay.enabled=${FEDAPAY_ENABLED:true}
fedapay.environment=${FEDAPAY_ENVIRONMENT:sandbox}
fedapay.secret-key=${FEDAPAY_SECRET_KEY:}
fedapay.webhook-secret=${FEDAPAY_WEBHOOK_SECRET:}
fedapay.callback-base-url=${FEDAPAY_CALLBACK_BASE_URL:http://localhost:5173/paiement}
fedapay.currency=XOF
fedapay.customer-country=${FEDAPAY_CUSTOMER_COUNTRY:tg}
fedapay.webhook-tolerance-seconds=300
fedapay.connect-timeout-ms=${FEDAPAY_CONNECT_TIMEOUT_MS:3000}
fedapay.read-timeout-ms=${FEDAPAY_READ_TIMEOUT_MS:8000}
# MERCHANT = la paroisse absorbe les frais ; CUSTOMER = le fidèle paie montant + frais (modèle cible)
fedapay.fees.payer=${FEDAPAY_FEES_PAYER:CUSTOMER}
fedapay.fees.tmoney-percent=${FEDAPAY_FEES_TMONEY_PERCENT:1.80}
fedapay.fees.flooz-percent=${FEDAPAY_FEES_FLOOZ_PERCENT:1.80}
fedapay.fees.carte-percent=${FEDAPAY_FEES_CARTE_PERCENT:3.60}
fedapay.fees.fixed-xof=${FEDAPAY_FEES_FIXED_XOF:0}

# Commission plateforme (développeur), payée en surplus par le fidèle
platform.commission-percent=${PLATFORM_COMMISSION_PERCENT:5.00}
platform.commission-fixed-xof=${PLATFORM_COMMISSION_FIXED_XOF:0}

# Échéances d'abonnement : tolérance avant coupure, alerte anticipée, balayage quotidien
platform.subscription-grace-days=${PLATFORM_SUBSCRIPTION_GRACE_DAYS:7}
platform.subscription-warning-days=${PLATFORM_SUBSCRIPTION_WARNING_DAYS:15}
platform.subscription-sweep-cron=${PLATFORM_SUBSCRIPTION_SWEEP_CRON:0 15 2 * * *}

# Catalogue plateforme (horaires + types + forfaits) cloné à chaque activation de paroisse.
app.tenant-catalog.backfill-on-startup=${APP_TENANT_CATALOG_BACKFILL:true}

# Demandes fidèles : rappels e-mail (D-3, toutes les 6 h) puis annulation auto (H-6).
app.demande.unpaid-auto-cancel-enabled=${APP_DEMANDE_UNPAID_AUTO_CANCEL:true}
app.demande.unpaid-cancel-hours-before=${APP_DEMANDE_UNPAID_CANCEL_HOURS:6}
app.demande.unpaid-cancel-cron=${APP_DEMANDE_UNPAID_CANCEL_CRON:0 */15 * * * *}
app.demande.unpaid-reminder-enabled=${APP_DEMANDE_UNPAID_REMINDER:true}
app.demande.unpaid-reminder-days-before=${APP_DEMANDE_UNPAID_REMINDER_DAYS:3}
app.demande.unpaid-reminder-cron=${APP_DEMANDE_UNPAID_REMINDER_CRON:0 0 */6 * * *}
app.demande.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}
app.demande.celebration-reminder-enabled=${APP_DEMANDE_CELEBRATION_REMINDER:true}
app.demande.celebration-reminder-cron=${APP_DEMANDE_CELEBRATION_REMINDER_CRON:0 */15 * * * *}
app.demande.celebration-auto-complete-enabled=${APP_DEMANDE_CELEBRATION_AUTO:true}
app.demande.celebration-auto-complete-delay-hours=${APP_DEMANDE_CELEBRATION_AUTO_DELAY_HOURS:5}
app.demande.celebration-auto-complete-cron=${APP_DEMANDE_CELEBRATION_AUTO_CRON:0 */5 * * * *}

# Stockage local des scans d'inscription et logos paroissiaux.
app.storage.root=${APP_STORAGE_ROOT:./uploads}
app.storage.max-file-bytes=${APP_STORAGE_MAX_FILE_BYTES:5242880}
app.storage.max-logo-bytes=${APP_STORAGE_MAX_LOGO_BYTES:2097152}
app.storage.logo-max-side-px=${APP_STORAGE_LOGO_MAX_SIDE:512}
app.storage.logo-jpeg-quality=${APP_STORAGE_LOGO_JPEG_QUALITY:0.85}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${APP_MULTIPART_MAX_FILE:6MB}
spring.servlet.multipart.max-request-size=${APP_MULTIPART_MAX_REQUEST:15MB}

# Domaine des e-mails professionnels (contact / équipe) : {slug}@missanye.com
app.mail.tenant-domain=${APP_MAIL_TENANT_DOMAIN:missanye.com}
app.mail.from=${APP_MAIL_FROM:noreply@missanye.com}
# SMTP (optionnel en dev) : SPRING_MAIL_HOST / USERNAME / PASSWORD.
# En prod : app.mail.fail-closed=true (pas d'envoi silencieux / pas de log du corps).
app.mail.fail-closed=${APP_MAIL_FAIL_CLOSED:false}

# ===============================
# RATE LIMIT (endpoints publics)
# ===============================
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.public-per-minute=${APP_RATE_LIMIT_PUBLIC:60}
app.rate-limit.demande-create-per-minute=${APP_RATE_LIMIT_DEMANDE:12}
app.rate-limit.auth-sensitive-per-minute=${APP_RATE_LIMIT_AUTH:8}
app.rate-limit.webhook-per-minute=${APP_RATE_LIMIT_WEBHOOK:120}
app.rate-limit.code-lookup-per-minute=${APP_RATE_LIMIT_CODE:30}

# ===============================
# ACTUATOR / MÉTRIQUES
# ===============================
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true

# ===============================
# JWT - COMMON SETTINGS
# ===============================
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
jwt.cookie-name=${JWT_COOKIE_NAME:MS_AT}
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}
jwt.cookie-path=${JWT_COOKIE_PATH:/}
jwt.cookie-encrypt=${JWT_COOKIE_ENCRYPT:true}

# ===============================
# SWAGGER / OPENAPI - COMMON PATHS
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ===============================
# SECURITY / HEADERS - COMMON SETTINGS
# ===============================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
