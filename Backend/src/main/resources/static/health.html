<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>État du service — Church Project</title>
  <style>
    :root { color-scheme: light; --bg:#f7fbff; --panel:#fff; --text:#0f172a; --muted:#64748b; --accent:#0f9d7e; --border:#dfe7f3; }
    body { margin:0; font-family:Inter,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text); }
    .card { width:min(700px,100%); background:var(--panel); border:1px solid var(--border); border-radius:24px; padding:32px; box-shadow:0 20px 60px rgba(15,23,42,.08); }
    .badge { display:inline-flex; align-items:center; gap:8px; background:#e8f8f2; padding:8px 12px; border-radius:999px; color:var(--accent); font-weight:700; }
    h1 { margin:14px 0 8px; font-size:1.7rem; }
    p { color:var(--muted); line-height:1.6; }
    .grid { display:grid; gap:10px; margin-top:18px; }
    .item { padding:12px 14px; border:1px solid var(--border); border-radius:14px; background:#fbfdff; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">● Service opérationnel</div>
    <h1>État du backend Church Project</h1>
    <p>Le service répond correctement et la plateforme peut continuer son exécution. Les points de surveillance peuvent être consultés via l’endpoint de santé.</p>
    <div class="grid">
      <div class="item">API : Disponible</div>
      <div class="item">Documentation Swagger : Disponible</div>
      <div class="item">Authentification JWT : Active</div>
    </div>
  </main>
</body>
</html>
