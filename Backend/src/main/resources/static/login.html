<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Messes Paroissiales</title>
  <meta name="description" content="Connexion sécurisée à l’espace de gestion paroissial." />
  <meta name="theme-color" content="#1e4d8c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fa;
      --surface: #ffffff;
      --text: #1a2332;
      --muted: #5c6b80;
      --primary: #1e4d8c;
      --primary-hover: #163a6b;
      --border: #d4dce8;
      --danger: #b91c1c;
      --danger-light: #fee2e2;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(15, 31, 53, 0.08);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      background: var(--bg);
    }
    .auth-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    }
    .auth-panel-brand {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      color: #f1f5f9;
      padding: clamp(28px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 28px;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(45, 108, 181, 0.45), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 90%, rgba(184, 134, 11, 0.12), transparent 50%),
        linear-gradient(165deg, #0b1a2e 0%, #12305a 48%, #1a3a6b 100%);
    }
    .auth-panel-brand::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black, transparent 75%);
      pointer-events: none;
      z-index: -1;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: inherit;
      text-decoration: none;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #2d6cb5);
      display: grid;
      place-items: center;
      font-size: 18px;
    }
    .brand-name {
      font-family: "Fraunces", "Iowan Old Style", Palatino, serif;
      font-size: clamp(1.25rem, 2vw, 1.55rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .illu-wrap {
      flex: 1;
      display: grid;
      place-items: center;
    }
    .illu-wrap img {
      width: min(100%, 520px);
      height: auto;
      display: block;
      filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.28));
    }
    .brand-copy { max-width: 28rem; }
    .brand-copy h2 {
      margin: 0 0 8px;
      font-family: "Fraunces", "Iowan Old Style", Palatino, serif;
      font-size: clamp(1.35rem, 2.2vw, 1.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .brand-copy p {
      margin: 0;
      color: rgba(241, 245, 249, 0.78);
      line-height: 1.55;
    }
    .auth-panel-form {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      padding: clamp(24px, 4vw, 48px) 24px;
      background: linear-gradient(180deg, #f7f9fc 0%, var(--bg) 100%);
    }
    .mobile-brand { display: none; width: min(420px, 100%); color: var(--text); }
    .auth-card {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(22px, 3vw, 32px);
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.45rem, 2.4vw, 1.75rem);
      font-weight: 800;
      letter-spacing: -0.025em;
    }
    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    form { display: grid; gap: 14px; }
    label { font-weight: 600; font-size: 0.95rem; }
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .text-btn {
      border: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fbfdff;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(30, 77, 140, 0.16);
    }
    button[type="submit"] {
      border: 0;
      width: 100%;
      margin-top: 4px;
      background: var(--primary);
      color: #fff;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: var(--primary-hover); }
    .footer-note {
      margin: 0;
      width: min(420px, 100%);
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }
    @media (max-width: 900px) {
      .auth-shell { grid-template-columns: 1fr; }
      .auth-panel-brand { display: none; }
      .mobile-brand { display: block; }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <aside class="auth-panel-brand" aria-label="Présentation">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">✝</span>
        <span class="brand-name">Messes Paroissiales</span>
      </a>
      <div class="illu-wrap">
        <img
          src="/assets/undraw-authentication.svg"
          alt=""
          width="520"
          height="407"
          decoding="async"
        />
      </div>
      <div class="brand-copy">
        <h2>Espace sécurisé de votre paroisse</h2>
        <p>Gérez les intentions, les célébrations et la trésorerie depuis un seul accès.</p>
      </div>
    </aside>

    <section class="auth-panel-form">
      <div class="mobile-brand">
        <a class="brand" href="/" style="color: var(--text);">
          <span class="brand-mark" aria-hidden="true">✝</span>
          <span class="brand-name">Messes Paroissiales</span>
        </a>
      </div>
      <div class="auth-card">
        <h1>Connexion</h1>
        <p class="sub">Identifiants fournis par votre paroisse ou l’équipe plateforme.</p>
        <form method="post" action="/auth/login" id="login-form">
          <div>
            <label for="username">Nom d’utilisateur</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ex. admin.paroisse" required />
          </div>
          <div>
            <div class="label-row">
              <label for="password">Mot de passe</label>
              <button type="button" class="text-btn" id="toggle-password" aria-pressed="false">Afficher</button>
            </div>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </div>
          <button type="submit">Se connecter</button>
        </form>
      </div>
      <p class="footer-note">Besoin d’aide ? Contactez l’administrateur de votre paroisse.</p>
    </section>
  </main>
  <script>
    (function () {
      var btn = document.getElementById('toggle-password');
      var input = document.getElementById('password');
      if (!btn || !input) return;
      btn.addEventListener('click', function () {
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Masquer' : 'Afficher';
        btn.setAttribute('aria-pressed', show ? 'true' : 'false');
      });
    })();
  </script>
</body>
</html>
