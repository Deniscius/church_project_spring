<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Church Project</title>
  <meta name="description" content="Connexion sécurisée à la plateforme Church Project" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f8fe;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #4f8cff;
      --accent-strong: #2958e5;
      --border: #dfe7f3;
      --success: #0f9d7e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text);
      background: linear-gradient(135deg, #eef5ff 0%, #f8fbff 100%); min-height: 100vh;
      display: grid; place-items: center; padding: 24px;
    }
    .auth-card { width: min(1120px, 100%); display: grid; grid-template-columns: 1.1fr 0.9fr; background: var(--panel); border: 1px solid var(--border); border-radius: 28px; box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12); overflow: hidden; }
    .illustration { background: linear-gradient(135deg, rgba(79,140,255,0.12), rgba(41,88,229,0.06)); padding: 34px; display: flex; align-items: center; justify-content: center; }
    .illustration img { width: min(100%, 480px); height: auto; display: block; }
    .form-panel { padding: clamp(24px, 3.2vw, 40px); display: flex; flex-direction: column; justify-content: center; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--accent-strong); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: .8rem; margin-bottom: 10px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 2.1vw, 2rem); }
    .subtext { margin: 0 0 22px; color: var(--muted); line-height: 1.6; }
    form { display: grid; gap: 14px; }
    label { font-weight: 600; font-size: 0.95rem; }
    input { width: 100%; padding: 13px 15px; border-radius: 12px; border: 1px solid var(--border); background: #fbfdff; font-size: 1rem; outline: none; transition: border-color .2s, box-shadow .2s; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79, 140, 255, 0.18); }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .95rem; color: var(--muted); }
    .checkbox { display: flex; align-items: center; gap: 8px; }
    button { border: 0; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); color: white; padding: 13px 16px; border-radius: 999px; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 10px 24px rgba(79, 140, 255, 0.24); }
    button:hover { transform: translateY(-1px); }
    .footer-note { margin-top: 18px; font-size: .93rem; color: var(--muted); }
    .footer-note a { color: var(--accent-strong); text-decoration: none; font-weight: 600; }
    @media (max-width: 900px) { .auth-card { grid-template-columns: 1fr; } .illustration { order: 2; padding: 20px; } .form-panel { order: 1; } }
  </style>
</head>
<body>
  <main class="auth-card" aria-label="Formulaire de connexion">
    <section class="illustration" aria-label="Illustration de connexion sécurisée">
      <img src="/assets/undraw-authentication.svg" alt="Illustration représentant une authentification sécurisée" />
    </section>
    <section class="form-panel">
      <div class="eyebrow">🔐 Accès sécurisé</div>
      <h1>Connexion à la plateforme</h1>
      <p class="subtext">Accédez à votre espace de gestion, aux demandes, aux paroisses et aux suivis avec une expérience simple et fiable.</p>
      <form method="post" action="/auth/login">
        <label for="username">Nom d’utilisateur</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="prenom.nom" required />
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        <div class="row">
          <label class="checkbox"><input type="checkbox" /> Se souvenir de moi</label>
          <a href="#" style="color: var(--accent-strong); text-decoration: none; font-weight: 600;">Mot de passe oublié ?</a>
        </div>
        <button type="submit">Se connecter</button>
      </form>
      <p class="footer-note">En cas de difficulté, contactez l'administrateur de votre paroisse ou l'équipe support.</p>
    </section>
  </main>
</body>
</html>
