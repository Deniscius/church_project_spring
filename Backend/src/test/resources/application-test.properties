# ===============================
# TEST PROFILE
# ===============================
# Les tests ne doivent jamais utiliser la base de développement.
spring.datasource.url=jdbc:h2:mem:church_project_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate détecte automatiquement H2 à partir du datasource.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Secret réservé exclusivement aux tests automatisés.
jwt.secret=dGVzdFNlY3JldEtleUZvckp3dDI1NkJpdHNNb25seQ==
jwt.expiration-ms=3600000

app.admin-seed.enabled=false
app.cors.allowed-origins=http://localhost

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
