    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1a3a6b" />
    <!-- Fond de secours avant CSS (thème) -->
    <style>
      html, body { margin: 0; min-height: 100%; background: #e8eef6; color: #121a2b; }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background: #0b1220; color: #f0f4fa;
      }
    </style>
    <!-- Thème avant paint : évite le flash clair/sombre (préférence système par défaut) -->
    <script>
      (function () {
        try {
          var key = 'missanye_theme';
          var pref = localStorage.getItem(key);
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'system';
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-pref', pref);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
