<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2748"/>
      <stop offset="55%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#243f72"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#5b8fd4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a3a6b" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#f0e6c0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f2748" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <ellipse cx="600" cy="280" rx="420" ry="260" fill="url(#glow)"/>
  <!-- nave arches -->
  <path d="M80 800 V340 C80 180 280 80 600 80 C920 80 1120 180 1120 340 V800" stroke="#2a4a7a" stroke-width="3" fill="none" opacity="0.55"/>
  <path d="M180 800 V380 C180 240 340 140 600 140 C860 140 1020 240 1020 380 V800" stroke="#3a5f94" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- rose window -->
  <circle cx="600" cy="260" r="118" fill="url(#glass)" stroke="#c9a227" stroke-width="3" opacity="0.9"/>
  <circle cx="600" cy="260" r="72" fill="none" stroke="#e8d48b" stroke-width="1.5" opacity="0.7"/>
  <circle cx="600" cy="260" r="28" fill="#c9a227" opacity="0.45"/>
  <g stroke="#e8d48b" stroke-width="1.2" opacity="0.65">
    <line x1="600" y1="142" x2="600" y2="378"/>
    <line x1="482" y1="260" x2="718" y2="260"/>
    <line x1="516" y1="176" x2="684" y2="344"/>
    <line x1="684" y1="176" x2="516" y2="344"/>
  </g>
  <!-- altar light -->
  <rect x="520" y="520" width="160" height="12" rx="2" fill="#c9a227" opacity="0.35"/>
  <rect x="560" y="480" width="80" height="40" rx="4" fill="#f0e6c0" opacity="0.18"/>
  <!-- floor perspective -->
  <path d="M0 800 L420 560 H780 L1200 800 Z" fill="#0c1f38" opacity="0.55"/>
  <path d="M420 560 H780 L720 800 H480 Z" fill="#152a4a" opacity="0.4"/>
</svg>
