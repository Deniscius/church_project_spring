# Missanye — Blueprint Render
# Docs: docs/RENDER.md
# Dashboard: New → Blueprint → sélectionner ce dépôt
#
# Après le premier apply, renseigner les secrets sync:false dans le Dashboard
# (JWT, FedaPay, URLs CORS / front), puis redéployer.

databases:
  - name: missanye-db
    plan: basic-256mb
    databaseName: missanye
    user: missanye
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------------------
  # API Spring Boot (Docker)
  # ---------------------------------------------------------------------------
  - type: web
    name: missanye-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /actuator/health
    # Disque persistant (logos / scans). Nécessite un plan compatible.
    # Sans disque : retirer ce bloc et accepter un stockage éphémère.
    disk:
      name: missanye-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: missanye-db
          property: connectionString
      - key: APP_STORAGE_ROOT
        value: /var/data/uploads
      - key: HIKARI_MAX_POOL_SIZE
        value: "5"
      - key: HIKARI_MIN_IDLE
        value: "1"
      - key: TOMCAT_MAX_THREADS
        value: "40"
      - key: JWT_COOKIE_SECURE
        value: "true"
      - key: JWT_COOKIE_SAME_SITE
        value: Lax
      - key: JWT_COOKIE_ENCRYPT
        value: "true"
      - key: APP_MAIL_FAIL_CLOSED
        value: "true"
      - key: FEDAPAY_ENABLED
        value: "false"
      - key: FEDAPAY_ENVIRONMENT
        value: live
      # Secrets / URLs — à saisir dans le Dashboard après le 1er apply
      - key: JWT_SECRET
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_WEBHOOK_SECRET
        sync: false
      - key: FEDAPAY_CALLBACK_BASE_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend Vite (Static Site + rewrite SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: missanye-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: Frontend/church-frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https:;"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # Injectées au build Vite — URLs absolues https://… (sans slash final)
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_PUBLIC_SITE_URL
        sync: false
