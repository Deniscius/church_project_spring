# Missanye — Blueprint Render (Togo)
# Docs: docs/RENDER.md
# Dashboard: New → Blueprint → sélectionner ce dépôt
#
# Région Frankfurt = latence optimale depuis le Togo (pas Oregon).
# Après le premier apply, renseigner les secrets sync:false, puis redéployer.

databases:
  - name: church_projetct_db
    plan: basic-256mb
    region: frankfurt
    databaseName: church_projetct_db
    user: postgres
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------------------
  # API Spring Boot (Docker) — context Backend/
  # ---------------------------------------------------------------------------
  - type: web
    name: missanye-api
    runtime: docker
    plan: starter
    region: frankfurt
    branch: master
    autoDeploy: true
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /actuator/health
    disk:
      name: missanye-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: missanye-db
          property: connectionString
      - key: APP_STORAGE_ROOT
        value: /app/uploads
      - key: HIKARI_MAX_POOL_SIZE
        value: "5"
      - key: HIKARI_MIN_IDLE
        value: "1"
      - key: TOMCAT_MAX_THREADS
        value: "40"
      - key: JWT_COOKIE_SECURE
        value: "true"
      # *.onrender.com est un public suffix → front et API sont cross-site
      - key: JWT_COOKIE_SAME_SITE
        value: None
      - key: JWT_COOKIE_ENCRYPT
        value: "true"
      - key: APP_MAIL_FAIL_CLOSED
        value: "true"
      - key: APP_MAIL_FROM
        value: noreply@missanye.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: FEDAPAY_ENABLED
        value: "false"
      - key: FEDAPAY_ENVIRONMENT
        value: live
      - key: FEDAPAY_CUSTOMER_COUNTRY
        value: tg
      # Secrets / URLs — Dashboard après le 1er apply
      - key: JWT_SECRET
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_WEBHOOK_SECRET
        sync: false
      - key: FEDAPAY_CALLBACK_BASE_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend Vite (Static Site + rewrite SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: missanye-web
    runtime: static
    branch: master
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: Frontend/church-frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https:;"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_PUBLIC_SITE_URL
        sync: false
